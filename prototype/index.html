<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>Meu espaço · Casa Serena — protótipo</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-house" viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M4 8h16l-1 13H5zM9 9V6a3 3 0 0 1 6 0v3"/></symbol>
    <symbol id="i-basket" viewBox="0 0 24 24"><path d="m5 10 3-6m11 6-3-6M3 10h18l-2 10H5zM9 13v4m6-4v4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M6 18v-6h3v6m3 0V5h3v13m3 0v-9h3v9"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V3m0 1c3-2 5 2 9 0 2-1 3-1 5 0v10c-2-1-3-1-5 0-4 2-6-2-9 0"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20m-15 5h4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h1m-1 7h1m-1 7h1"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16 10-10 4 4L8 20H4zm11-11 2-2 4 4-2 2"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 4C8 4 4 9 4 16a4 4 0 0 0 4 4c7 0 12-4 12-16ZM5 19c3-5 6-7 12-10"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v6m0-9h.01"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z"/></symbol>
  </svg>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand"><span class="brand-mark"><svg><use href="#i-leaf"/></svg></span><span>Meu espaço</span></div>
      <nav id="desktop-nav" class="desktop-nav"></nav>
      <div class="sidebar-bottom"><button type="button" class="utility-link" data-action="demo-note"><svg><use href="#i-info"/></svg>Sobre este protótipo</button><span class="sidebar-caption">Casa Serena · exploração visual</span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <button class="mobile-menu icon-button" type="button" data-action="menu" aria-label="Abrir menu"><svg><use href="#i-menu"/></svg></button>
        <div class="mobile-brand"><span class="brand-mark"><svg><use href="#i-leaf"/></svg></span><strong>Meu espaço</strong></div>
        <button class="search-trigger" type="button" data-action="search"><svg><use href="#i-search"/></svg><span>Buscar registros, projetos e itens</span><kbd>Ctrl K</kbd></button>
        <div class="topbar-actions"><button class="primary-button new-button" type="button" data-action="new"><svg><use href="#i-plus"/></svg><span>Novo</span></button><button class="avatar" type="button" data-action="demo-note" aria-label="Perfil Vytor">V</button><span class="user-name">Vytor</span></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Navegação móvel"></nav>
    <div id="overlay-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </div>
</body>
</html>
